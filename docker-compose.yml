services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=nexus-office-prod-secret-2026
      - OFFICE_NAME=Nexus Headquarters - Tech Park
    volumes:
      - ./backend/data:/app/data
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexus_network

networks:
  nexus_network:
    driver: bridge
